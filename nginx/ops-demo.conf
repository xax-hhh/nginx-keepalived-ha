# ──────────────────────────────────────────────────
# Linux 运维实训项目 — Nginx 配置（5 服务器 HA 架构）
# 部署路径：/etc/nginx/conf.d/ops-demo.conf
# 部署目标：Nginx-1（192.168.10.120）和 Nginx-2（192.168.10.123）
# 两台 Nginx 配置完全相同
#
# 【改】如有 IP 变更，修改 upstream 和 allow 指令中的地址
# ──────────────────────────────────────────────────

upstream java_backend {
    # 会话亲和：同一客户端 IP 始终到同一台后端（无 Redis 时保证 Session 不丢）
    ip_hash;

    # 两台 Java 后端（高可用 + 负载均衡）
    server 192.168.10.121:8080 max_fails=3 fail_timeout=30s;
    server 192.168.10.124:8080 max_fails=3 fail_timeout=30s;

    # 长连接池（减少 TCP 握手开销）
    keepalive 32;
}

server {
    listen 80;

    # 【改】生产环境替换为实际域名
    server_name _;

    charset utf-8;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── 访问日志 ──
    access_log /var/log/nginx/ops-demo-access.log;
    error_log  /var/log/nginx/ops-demo-error.log;

    # ── 静态资源根目录 ──
    root /opt/ops-demo/static;
    index index.html;

    # ════════════════════════════════════════════════
    # 1. Keepalived 健康检查（供 VIP 漂移判断）
    # ════════════════════════════════════════════════
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ════════════════════════════════════════════════
    # 2. API 请求 → 反向代理到 Java 后端集群
    # ════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://java_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ════════════════════════════════════════════════
    # 3. Actuator 健康检查 — 仅允许内网
    # ════════════════════════════════════════════════
    location /actuator/health {
        allow 127.0.0.1;
        allow 192.168.10.120;   # Nginx-1
        allow 192.168.10.121;   # Java-1
        allow 192.168.10.123;   # Nginx-2
        allow 192.168.10.124;   # Java-2
        deny all;

        proxy_pass http://java_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ════════════════════════════════════════════════
    # 4. 静态文件 — Nginx 直接 serve
    # ════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ════════════════════════════════════════════════
    # 5. 静态资源缓存策略
    # ════════════════════════════════════════════════
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Nginx-Server "$hostname" always;
    }

    # ════════════════════════════════════════════════
    # 6. 安全头
    # ════════════════════════════════════════════════
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Nginx-Server "$hostname" always;
    
    # ════════════════════════════════════════════════
    # 7. 通用安全加固
    # ════════════════════════════════════════════════
    server_tokens off;
    client_max_body_size 10m;

    # 禁止通过 IP 直接访问时展示默认页面
    # （如果匹配不到 server_name 会走默认 server，此处加个限制）
}
