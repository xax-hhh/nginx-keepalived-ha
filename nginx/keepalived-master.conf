! ──────────────────────────────────────────────────
! Linux 运维实训项目 — Keepalived MASTER 节点配置
! 部署路径：/etc/keepalived/keepalived.conf
! 部署目标：Nginx-1（主节点，优先级更高）
! ──────────────────────────────────────────────────

global_defs {
    router_id NGINX_1
    script_user root
    enable_script_security
}

! ── Nginx 存活检测脚本 ──
vrrp_script chk_nginx {
    script "/usr/bin/curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/nginx-health | grep -q 200"
    interval 2
    weight -10
    fall 3
    rise 2
    timeout 2
}

! ── VRRP 实例 ──
vrrp_instance VI_1 {
    state MASTER
    interface ens160
    virtual_router_id 51
    priority 120                     ! 主节点优先级更高（120 > 100）
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass OpsDm24            ! 最长 8 字符，两台必须一致
    }

    virtual_ipaddress {
        192.168.1.200/24 dev ens160 label ens160:vip
    }

    track_script {
        chk_nginx
    }

    notify_master "/usr/bin/systemctl start nginx 2>/dev/null || true"
    notify_backup "/usr/bin/systemctl start nginx 2>/dev/null || true"
    notify_fault  "/usr/bin/systemctl stop nginx 2>/dev/null || true"
}
