server:
  port: 8080

app:
  server-id: ${SERVER_ID:unknown}

spring:
  application:
    name: linux-ops-demo

  datasource:
    url: jdbc:mysql://192.168.10.122:3306/ops_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ops_user
    password: OpsUser@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: bXlTZWNyZXRLZXlGb3JKV1RTaWduaW5nRm9yT3BzVHJhaW5pbmdEZW1vUHJvamVjdA==
  expiration: 86400000

logging:
  level:
    com.ops.demo: DEBUG
    org.springframework.security: DEBUG
